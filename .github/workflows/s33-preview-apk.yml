name: S33 preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Resolve preview directory
        run: echo "PREVIEW_DIR=$RUNNER_TEMP/vittaz-preview/ui" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 24.22.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.2"

      - name: Copy owner preview into runner temp
        run: |
          mkdir -p "$PREVIEW_DIR"
          cp -R apps/mobile "$PREVIEW_DIR/native"
          rm -rf "$PREVIEW_DIR/native/node_modules"
          # metro.config.cjs watches ../../packages/core/src, so the domain core
          # must exist at the same relative path inside the temp tree.
          mkdir -p "$PREVIEW_DIR/../packages"
          cp -R packages/core "$PREVIEW_DIR/../packages/core"
          cp -R packages/storage "$PREVIEW_DIR/../packages/storage"
          rm -rf "$PREVIEW_DIR/../packages/core/node_modules"
          rm -rf "$PREVIEW_DIR/../packages/storage/node_modules"
          test -f "$PREVIEW_DIR/native/App.tsx"
          test -f "$PREVIEW_DIR/native/metro.config.cjs"
          test -f "$PREVIEW_DIR/native/ui/src/state.ts"
          test -f "$PREVIEW_DIR/../packages/core/src/index.ts"
          test -f "$PREVIEW_DIR/../packages/storage/src/expo_sqlite_store.ts"

      - name: Install preview dependencies and expo-dev-client in temp only
        run: |
          cd "$PREVIEW_DIR/native"
          npm ci
          npx expo install expo-dev-client
          node -e "const p=require('./package.json');const d=p.dependencies;console.log(JSON.stringify({expo:d.expo,expo_dev_client:d['expo-dev-client'],react_native:d['react-native'],safe_area_context:d['react-native-safe-area-context'],svg:d['react-native-svg'],linear_gradient:d['expo-linear-gradient']},null,2))"

      - name: Prebuild Android in temp
        run: |
          cd "$PREVIEW_DIR/native"
          npx expo prebuild --platform android --clean

      - name: Assert required native modules are autolinked
        run: |
          cd "$PREVIEW_DIR/native"
          npx expo-modules-autolinking react-native-config --platform android --json > "$RUNNER_TEMP/rn-config.json"
          npx expo-modules-autolinking resolve --platform android --json > "$RUNNER_TEMP/expo-modules.json"
          node -e '
            const fs = require("node:fs");
            const dir = process.env.RUNNER_TEMP;
            const rn = JSON.parse(fs.readFileSync(`${dir}/rn-config.json`, "utf8"));
            const expo = JSON.parse(fs.readFileSync(`${dir}/expo-modules.json`, "utf8"));
            const rnDeps = Object.keys(rn.dependencies ?? {});
            const expoDeps = (expo.modules ?? []).map((m) => m.packageName);
            const required = [
              ["react-native-safe-area-context", rnDeps],
              ["react-native-svg", rnDeps],
              ["expo-linear-gradient", expoDeps],
              ["expo-dev-client", expoDeps],
            ];
            const missing = required.filter(([name, list]) => !list.includes(name)).map(([name]) => name);
            console.log(JSON.stringify({ rn_autolinked: rnDeps, expo_autolinked: expoDeps, missing }, null, 2));
            if (missing.length > 0) {
              throw new Error(`required native modules not autolinked: ${missing.join(", ")}`);
            }
          '

      - name: Build standalone release APK and dev-client debug APK
        run: |
          cd "$PREVIEW_DIR/native/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.enableMinifyInReleaseBuilds=false

      - name: Assert the release APK embeds the JavaScript bundle
        run: |
          cd "$PREVIEW_DIR/native/android/app/build/outputs/apk"
          unzip -l release/app-release.apk | grep -E "assets/index.android.bundle|lib/arm64-v8a/" | head -20
          unzip -l release/app-release.apk | grep -q "assets/index.android.bundle"
          ls -l release/app-release.apk debug/app-debug.apk

      - name: Assert the repository working tree is unchanged
        run: |
          git diff --exit-code
          git status --porcelain

      - name: Upload standalone preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s33-preview-standalone-apk
          path: ${{ runner.temp }}/vittaz-preview/ui/native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload dev-client preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s33-preview-devclient-apk
          path: ${{ runner.temp }}/vittaz-preview/ui/native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
