name: S33 Android proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blank-expo-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 24.22.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.2"

      - name: Create blank Expo TypeScript app with expo-dev-client
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          npx --yes create-expo-app@5.0.0 "$RUNNER_TEMP/vittaz-s33-blank" --template blank-typescript --yes
          cd "$RUNNER_TEMP/vittaz-s33-blank"
          npx expo install expo-dev-client
          npx expo prebuild --platform android --clean
          node -e "const p=require('./package.json'); console.log(JSON.stringify({expo:p.dependencies.expo,expo_dev_client:p.dependencies['expo-dev-client'],react_native:p.dependencies['react-native']}))"

      - name: Build debug APK with Gradle
        run: |
          cd "$RUNNER_TEMP/vittaz-s33-blank/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s33-android-proof-apk
          path: ${{ runner.temp }}/vittaz-s33-blank/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
