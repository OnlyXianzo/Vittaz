name: Native app

on:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/agent/**"
      - "packages/core/**"
      - "packages/storage/src/expo_sqlite_store.ts"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/agent/**"
      - "packages/core/**"
      - "packages/storage/src/expo_sqlite_store.ts"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      # The app consumes packages/agent as source, and that source imports the
      # AI SDK. TypeScript resolves those from the workspace root, so the root
      # install is required before typecheck, not just the app's own.
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --ci
      # Native bundle check: proves Metro resolves core and expo-sqlite on Android.
      - run: npx expo export --platform android --output-dir dist-android
      # Web uses the Expo SQLite WASM asset and COEP/COOP Metro headers.
      - run: npm run export:web
